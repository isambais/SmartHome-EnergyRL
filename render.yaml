services:
  # ── Backend: FastAPI ──────────────────────────────────────────
  - type: web
    name: smarthome-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./smarthome.db
      - key: EPIAS_USER
        value: ""
      - key: EPIAS_PASS
        value: ""
    healthCheckPath: /docs

  # ── Frontend: React (Vite) ────────────────────────────────────
  - type: web
    name: smarthome-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Backend deploy edildikten sonra buraya Render URL'sini yaz:
        # örn: https://smarthome-api.onrender.com
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
